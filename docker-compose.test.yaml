services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: wallet_test
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U test_user -d wallet_test"]
      interval: 1s
      timeout: 3s
      retries: 30
