services:
  db-currency-wallet:
    image: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_NAME}
      - PGDATA=/data/postgres
    volumes:
      - ./out/wallet_pg_data:/data/postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 30s
      timeout: 10s
      retries: 5

  db-exchanger:
    image: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER_EXCHANGER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_EXCHANGER}
      - POSTGRES_DB=${POSTGRES_NAME_EXCHANGER}
      - PGDATA=/data/postgres
    volumes:
      - ./out/exchanger_pg_data:/data/postgres
    ports:
      - "${POSTGRES_PORT_EXCHANGER}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 30s
      timeout: 10s
      retries: 5

  migrate-wallet:
    image: migrate/migrate:v4.19.1
    depends_on:
      db-currency-wallet:
        condition: service_healthy
    volumes:
      - ./services/gw-currency-wallet/migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-currency-wallet:5432/${POSTGRES_NAME}?sslmode=disable"
      - "up"

  migrate-exchanger:
    image: migrate/migrate:v4.19.1
    depends_on:
      db-exchanger:
        condition: service_healthy
    volumes:
      - ./services/gw-exchanger/migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${POSTGRES_USER_EXCHANGER}:${POSTGRES_PASSWORD_EXCHANGER}@db-exchanger:5432/${POSTGRES_NAME_EXCHANGER}?sslmode=disable"
      - "up"

  wallet:
    build:
      context: .
      dockerfile: ./services/gw-currency-wallet/Dockerfile
    image: wallet-app:local
    env_file:
      - config.env
    environment:
      POSTGRES_PORT: "5432"
    ports:
      - "${HTTP_PORT}:${HTTP_ADDR}"
    depends_on:
      migrate-wallet:
        condition: service_completed_successfully
